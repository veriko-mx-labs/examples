name: Lint examples

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  autoria:
    if: github.event_name != 'workflow_dispatch'
    uses: veriko-mx-labs/.github/.github/workflows/autoria.yml@eaaa2dca88eec1abbb98d75c8638290a28e0bbbb
    secrets:
      config: ${{ secrets.VERIKO_LABS_AUTORIA_CONFIG }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.1'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Shell syntax (curl example)
        run: bash -n curl/validate.sh

      - name: Node.js syntax (node example)
        run: node --check node/validate.mjs

      - name: Install contract checker
        run: npm ci

      - name: Routes exist and are M2M
        run: npm test

      - name: Python syntax (python example)
        run: python -m py_compile python/validate.py

      - name: PHP syntax (php example)
        run: php -l php/validate.php
